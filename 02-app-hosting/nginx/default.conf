# nginx/default.conf – reverse proxy před WordPressem.
# Reverse proxy = přijímá požadavky od klientů a přeposílá je aplikaci za sebou.
# Výhody: HTTPS na jednom místě, aplikace není přímo vystavená, snadno přidám další weby.

# HTTP -> přesměrovat na HTTPS (301 = trvalé přesměrování)
server {
    listen 80;
    server_name _;                       # "_" = libovolné jméno/IP
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3; # staré TLS 1.0/1.1 jsou nebezpečné

    # Bezpečnostní hlavičky
    add_header X-Frame-Options SAMEORIGIN;        # web nejde vložit do cizího iframe (clickjacking)
    add_header X-Content-Type-Options nosniff;    # prohlížeč nehádá typ souboru
    add_header Referrer-Policy strict-origin-when-cross-origin;

    client_max_body_size 64m;            # max. velikost uploadu (obrázky, pluginy)

    location / {
        proxy_pass http://wordpress:80;  # "wordpress" = jméno služby v docker-compose
        proxy_set_header Host              $http_host;   # původní host i s portem (WP podle něj tvoří odkazy)
        proxy_set_header X-Real-IP         $remote_addr; # skutečná IP klienta (jinak by WP viděl IP nginxu)
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;        # WP pozná, že klient přišel přes HTTPS
    }
}
